<script>
"use strict";
const { CONS } = window.SZ_DATA, $ = (id) => document.getElementById(id), app = $("app");
const SITE = "https://satou-aaaaa.github.io/seiza-tsunagi/";
const FEEDBACK = "https://github.com/satou-aaaaa/seiza-tsunagi/issues/new?template=feedback.yml";
const KEY = "seiza-v1", EPOCH = "2026-11-04", PER = 3, S = 1000, HIT = 62;

const jstNow = () => new Date(Date.now() + 9 * 3600e3);
const todayKey = () => jstNow().toISOString().slice(0, 10);
const dayNo = (k) => Math.round((Date.parse(k) - Date.parse(EPOCH)) / 864e5) + 1;
const md = (k) => `${+k.slice(5, 7)}/${+k.slice(8, 10)}`;
const prevDay = (k) => new Date(Date.parse(k) - 864e5).toISOString().slice(0, 10);
function seedOf(str) { let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// その日の夜9時（日本）に南の空の真ん中に来る赤経（時）。春分ごろの夜9時がおよそ9時
const doy = (k) => (Date.parse(k) - Date.parse(k.slice(0, 4) + "-01-01")) / 864e5 + 1;
const raAt21 = (k) => (((doy(k) - 80) / 365.25) * 24 + 9 + 48) % 24;
const raDist = (a, b) => { const d = Math.abs(a - b) % 24; return Math.min(d, 24 - d); };
// 星座がいちばん見やすい月（夜9時に南中する月）
const bestMonth = (c) => { const d = 80 + ((c.ra - 9 + 24) % 24) / 24 * 365.25; return new Date(Date.UTC(2026, 0, Math.round(d))).getUTCMonth() + 1; };
const where = (c) => (c.dec > 50 ? "北の空" : c.dec < -15 ? "南の低い空" : c.dec > 25 ? "空の高い所" : "南の空");
// 見ごろの星座：夜9時の南の空から近い順に7つ（北の空の星座はいつでも候補）
function inSeason(k) { const r = raAt21(k); return CONS.map((c, i) => [i, c.dec > 50 ? Math.min(raDist(c.ra, r), 3) : raDist(c.ra, r)]).sort((a, b) => a[1] - b[1]).slice(0, 7).map((x) => x[0]); }
function rawPick(k, salt) {
  const R = rng(seedOf(k + salt)), pool = inSeason(k);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  return pool.slice(0, PER).sort((a, b) => a - b);
}
function pick(k, hard) {
  const R = rng(seedOf(k + (hard ? "h" : "")));
  if (!hard) { // 前の日と同じ3つになったら選び直す（季節の候補が7つなので、ときどき重なる）
    let a = rawPick(k, ""); if (a.join() === rawPick(prevDay(k), "").join()) a = rawPick(k, "b");
    return a.sort((x, y) => CONS[x].lines.length - CONS[y].lines.length);
  }
  const daily = pick(k, false), rest = CONS.map((_, i) => i).filter((i) => !daily.includes(i));
  for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
  return rest.slice(0, PER);
}

// とことん：線の少ない星座 → 多い星座の順に全部の星座（並びは毎回ちがう）、2周目は見本なしで同じように。まちがい・ヒント1回で🎫1枚、🎫が無いときにまちがえると終わり
const ELIFE = 3, ETIER = (c) => (c.lines.length <= 5 ? 0 : c.lines.length <= 7 ? 1 : 2);
function endlessList() { const lap = () => { const out = []; for (const t of [0, 1, 2]) { const pool = CONS.map((_, i) => i).filter((i) => ETIER(CONS[i]) === t); for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; } out.push(...pool); } return out; }; return [...lap(), ...lap()]; }
const blindAt = (run, i) => run.mode === "h" || (run.mode === "e" && i >= CONS.length); // とことんの2周目は見本なし
const fresh = () => ({ v: 1, days: {}, hdays: {}, pdays: {}, dex: {}, runs: {}, tut: false, kofi: {}, ach: {}, apark: {}, ebest: 0 }); // pdays: あとから遊んだ日の結果（連続の夜・今日の記録には数えない）。ach: 結果の画面で知らせ終えた実績。apark: あとから遊ぶ日の途中経過を日付ごとに預けておく所（別の日を始めても消さない。戻したら null）
let MODE = "d"; // 遊んでいるモード。途中経過はモードごとに runs[mode] へ分けて置く（練習で今夜の途中を消さない）
let mem = null; // 保存できない環境（保存を切ったブラウザなど）では、開いているあいだだけここに置く
const doneOf = (r) => !!r && r.res.length >= r.list.length, recOf = (r) => ({ m: r.res });
// 終わった今日・上級の回を日ごとの記録に入れる（結果を見る前に別のタブが次の日を保存しても、終えた日を失わない）
